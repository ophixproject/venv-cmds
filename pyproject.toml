[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "venv-cmds"
version = "2026.06.10.01"
description = "List available console commands in the active Python environment, check for package updates"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
keywords = ["venv", "python", "cli", "console scripts"]

authors = [
    {name = "Paul McGowan", email = "paul.mcgowan@ophix.io"}
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "importlib_metadata>=3.6; python_version < '3.8'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://ophix.io"
Documentation = "https://github.com/ophixproject/venv-cmds#readme"
Source = "https://github.com/ophixproject/venv-cmds"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
venv-cmds = "venv_cmds.cli:main"
